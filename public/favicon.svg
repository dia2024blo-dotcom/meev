<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- MEEV — the cat head brand mark (logo.tsx geometry: asymmetric ears,
       big round eyes, jagged chin). v14: THE site identity — the single
       muted GOLD -> CREAM gradient (the user's own swatch #BEB15C ->
       #D5CFAB). TRANSPARENT background (no rim, no plate): the mark is
       the gradient itself, with a thin deep-gold outline so it reads
       crisply on light AND dark browser tabs. -->
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5A452"/>
      <stop offset="0.55" stop-color="#CDC494"/>
      <stop offset="1" stop-color="#E4DDC0"/>
    </linearGradient>
  </defs>

  <!-- ears (outer triangle + inner notch cutout, the asymmetric Meev mark) -->
  <path fill-rule="evenodd" fill="url(#mg)" stroke="#8F7C35" stroke-width="2.5" stroke-linejoin="round"
    d="M30 46 L20 8 L52 30 Z M30 44 L25 20 L46 34 Z"/>
  <path fill-rule="evenodd" fill="url(#mg)" stroke="#8F7C35" stroke-width="2.5" stroke-linejoin="round"
    d="M90 46 L100 8 L68 30 Z M90 44 L95 20 L74 34 Z"/>

  <!-- head with jagged chin -->
  <path
    d="M22 44 C14 66 18 86 30 95 L38 100 L44 93 L60 104 L76 93 L82 100 L90 95 C102 86 106 66 98 44 C92 30 76 22 60 22 C44 22 28 30 22 44 Z"
    fill="url(#mg)" stroke="#8F7C35" stroke-width="2.5" stroke-linejoin="round"
  />

  <!-- eyes: dark cocoa (strong contrast on the gold) -->
  <circle cx="42" cy="58" r="10" fill="#241C0E"/>
  <circle cx="78" cy="58" r="10" fill="#241C0E"/>
  <circle cx="44" cy="56" r="2.8" fill="#EFE9CF"/>
  <circle cx="80" cy="56" r="2.8" fill="#EFE9CF"/>

  <!-- nose + smile -->
  <path d="M56 76 L64 76 L60 82 Z" fill="#241C0E"/>
  <path d="M52 86 q8 6 16 0" fill="none" stroke="#241C0E" stroke-width="3" stroke-linecap="round"/>
</svg>
